name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright & Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Wake up Streamlit apps
        env:
          APP_URLS: |
            https://power-data-pipeline-bqhbx2x3rta7odtqusg8bb.streamlit.app/
            https://data-analytics-bi-portfolio-ek57rbdepycxrx94gjvdv8.streamlit.app/
        shell: python
        run: |
          import os, sys, time
          from playwright.sync_api import sync_playwright

          urls = [u.strip() for u in os.environ["APP_URLS"].splitlines() if u.strip()]
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for url in urls:
                  page = browser.new_page()
                  try:
                      print(f"Connecting to: {url}")
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      time.sleep(5)
                      text = page.inner_text("body")
                      
                      # Détection de l'écran de mise en veille
                      wake_buttons = page.locator("button:has-text('Yes, get this app back up'), button:has-text('wake it back up'), button:has-text('Wake')").all()
                      if "This app has gone to sleep" in text or "Zzzz" in text or len(wake_buttons) > 0:
                          print(f"[SLEEP DETECTED] {url} est en veille. Clic sur le bouton de réveil...")
                          if len(wake_buttons) > 0:
                              wake_buttons[0].click()
                          else:
                              for b in page.locator("button").all():
                                  txt = b.inner_text().strip().lower()
                                  if "back up" in txt or "wake" in txt:
                                      b.click()
                                      break
                          print("Attente du démarrage du conteneur (20s)...")
                          time.sleep(20)
                          print(f"[REVEIL REUSSI] {url}")
                      else:
                          print(f"[EN LIGNE] {url} est déjà actif et opérationnel.")
                  except Exception as e:
                      print(f"[INFO] Erreur de vérification sur {url}: {e}")
                  finally:
                      page.close()
              browser.close()
