name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit Cloud application
        run: |
          curl -s -L -A "Mozilla/5.0" "https://power-data-pipeline-bqhbx2x3rta7odtqusg8bb.streamlit.app/" > /dev/null
          curl -s -L -A "Mozilla/5.0" "https://power-data-pipeline-bqhbx2x3rta7odtqusg8bb.streamlit.app/_stcore/health" || true
